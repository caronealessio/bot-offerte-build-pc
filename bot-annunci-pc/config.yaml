# =====================================================================
#  CONFIGURAZIONE DEL BOT ANNUNCI PC
#  Puoi modificare questo file direttamente dal sito di GitHub
#  (apri il file -> icona matita -> "Commit changes").
# =====================================================================

# --- Regole di prezzo (percentuali sul riferimento del NUOVO) ---------
regole:
  giorni_mediana: 30          # finestra per le mediane
  usato_max_su_nuovo: 0.70    # usato "buon prezzo" se <= 70% del nuovo
  soglia_affare: 0.60         # sotto il 60% -> etichetta gialla "affare, verifica"
  soglia_truffa: 0.50         # sotto il 50% -> etichetta rossa "possibile truffa"
  nuovo_calo: 0.90            # nuovo: avvisa se <= 90% della mediana 30 gg
  min_campioni_usato: 5       # annunci minimi per fidarsi della mediana usato
  min_giorni_storico_nuovo: 7 # giorni minimi prima di segnalare "minimo storico"

# --- Budget massimo per tipo (spedizione inclusa) -----------------------
# Sopra questa cifra non arriva nessun avviso, né per l'usato né per il nuovo.
# Un prodotto può avere un suo "budget:" che sostituisce questo.
budget:
  gpu: 500
  cpu: 250
  ram: 180

# --- Filtri sui negozi (per calcolare il prezzo del nuovo) ------------
negozi:
  stelle_minime: 3.5          # media recensioni del negozio su Trovaprezzi
  recensioni_minime: 30
  escludi:                    # marketplace/negozi da non usare come riferimento
    - eBay

# --- Frequenze ---------------------------------------------------------
frequenze:
  nuovo_ogni_ore: 2           # quanto spesso rileggere Trovaprezzi
  riepilogo_settimanale: lunedi

# --- Parole che scartano un annuncio (titolo o descrizione) -----------
scarta_se_contiene:
  - guast
  - non funzionant
  - "per pezzi"
  - "per ricambi"
  - "solo scatola"
  - "scatola vuota"
  - "box vuoto"
  - "\\bcerco\\b"
  - "\\bcompro\\b"
  - "\\bscambio\\b"
  - "\\bscambi\\b"
  - difettos
  - "da riparare"
  - "artefatti"
  - "no video"

# --- Parole sospette nella descrizione (aggiungono un avviso) ---------
sospetto_se_contiene:
  - bonifico
  - "amici e familiari"
  - "amici e parenti"
  - "friends"
  - whatsapp
  - telegram
  - "solo spedizione"
  - "scrivimi (a|su|alla) "
  - "@gmail"
  - "@hotmail"
  - "@libero"
  - "\\+39"
  - "\\b3\\d{2}[ .]?\\d{6,7}\\b"
  - "ricarica postepay"
  - postepay

