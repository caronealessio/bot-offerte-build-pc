name: Bot annunci PC

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      modalita:
        description: "normale oppure test-telegram"
        required: false
        default: "normale"

permissions:
  contents: write

concurrency:
  group: bot-annunci
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Esegui il bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event.inputs.modalita }}" = "test-telegram" ]; then
            python -m bot.main --test-telegram
          else
            python -m bot.main
          fi

      - name: Salva lo storico prezzi
        run: |
          git config user.name "bot-annunci"
          git config user.email "bot-annunci@users.noreply.github.com"
          git add data/stato.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna storico prezzi" -q
            git pull --rebase -q || true
            git push -q
          fi
